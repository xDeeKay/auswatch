services:
  db:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    environment:
      POSTGRES_USER: auswatch
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: auswatch
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - auswatch-db-data:/var/lib/postgresql/data

volumes:
  auswatch-db-data:
