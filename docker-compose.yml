services:
  db:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: auswatch
    ports:
      - "5432:5432"
    volumes:
      - auswatch-db-data:/var/lib/postgresql/data

volumes:
  auswatch-db-data:
